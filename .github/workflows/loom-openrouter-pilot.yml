name: Loom bounded OpenRouter pilot

# A paid run requires a new, explicitly enabled request committed on this branch.
# Workflow edits, ordinary code pushes and pull requests cannot start paid calls.
on:
  push:
    branches:
      - codex/loom-handoff-2026-09-28
    paths:
      - docs/research/openrouter-pilot-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: loom-openrouter-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: >-
      github.repository == 'klb-t/chatadhd' &&
      github.ref == 'refs/heads/codex/loom-handoff-2026-09-28' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PILOT_DIR: ${{ runner.temp }}/loom-openrouter-pilot
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Read the exact activation commit and its request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require an enabled one-time request and a configured key
        id: gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.LOOM_OPENROUTER_PILOT_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import decimal, json, os, pathlib, re, subprocess

          def output(value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(value + '\n')

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise SystemExit('Duplicate request key; refusing the run.')
                  result[key] = value
              return result

          request_path = 'docs/research/openrouter-pilot-request.json'
          raw = pathlib.Path(request_path).read_bytes()
          if len(raw) > 16384:
              raise SystemExit('Request exceeds 16 KiB; refusing the run.')
          request = json.loads(raw, object_pairs_hook=pairs)
          output('enabled=false')
          if request.get('enabled') is False:
              print('Pilot disabled: no API calls scheduled.')
              raise SystemExit(0)
          if request.get('enabled') is not True:
              raise SystemExit('Request enabled must be a JSON boolean.')
          if not os.environ.get('OPENROUTER_API_KEY'):
              print('Pilot skipped: LOOM_OPENROUTER_PILOT_KEY is not configured.')
              raise SystemExit(0)
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('Reruns are disabled. Reconcile the first attempt before a new experiment.')
          experiment_id = request.get('experiment_id', '')
          if not isinstance(experiment_id, str) or not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,63}', experiment_id):
              raise SystemExit('Invalid experiment_id; use 1-64 lowercase letters, digits or hyphens.')
          if request.get('schema') != 'loom.live_pilot_request/1':
              raise SystemExit('Unknown request schema.')
          budget = request.get('budget_usd')
          if isinstance(budget, bool) or not isinstance(budget, (int, float, str)):
              raise SystemExit('A finite budget_usd of at most 2 USD is required.')
          try:
              budget = decimal.Decimal(str(budget))
          except decimal.InvalidOperation:
              raise SystemExit('Invalid budget_usd.')
          if not budget.is_finite() or not decimal.Decimal('0') < budget <= decimal.Decimal('2'):
              raise SystemExit('A finite budget_usd of at most 2 USD is required.')

          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=30).strip()

          if git('rev-parse', '--is-shallow-repository') != 'false':
              raise SystemExit('Complete request history is required before paid calls.')
          if git('log', '-1', '--format=%H', '--', request_path) != os.environ['GITHUB_SHA']:
              raise SystemExit('This commit must change the request itself.')
          history = git('log', '--max-count=201', '--format=%H', 'HEAD^', '--', request_path).splitlines()
          if len(history) > 200:
              raise SystemExit('Request history needs an explicit audit before another run.')
          for revision in history:
              previous_raw = git('show', revision + ':' + request_path)
              if len(previous_raw.encode('utf-8')) > 16384:
                  raise SystemExit('Historical request too large to validate.')
              previous = json.loads(previous_raw, object_pairs_hook=pairs)
              if previous.get('enabled') is True and previous.get('experiment_id') == experiment_id:
                  raise SystemExit('This experiment_id was already enabled in request history; refusing duplicate spend.')
          output('experiment_id=' + experiment_id)
          output('enabled=true')
          print('Enabled one-time pilot request accepted. Budget ceiling: ' + str(budget) + ' USD.')
          PY

      - name: Freeze authored inputs and current public model pricing
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 180s \
            python3 loom/tools/structure/live_pilot.py prepare \
              --request docs/research/openrouter-pilot-request.json \
              --output-dir "$PILOT_DIR"
          python3 loom/tools/structure/openrouter_runner.py plan "$PILOT_DIR/manifest.json"

      - name: Check earlier reservations and record this attempt
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT_ID: ${{ steps.gate.outputs.experiment_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request

          name = 'loom-openrouter-reservation-' + os.environ['EXPERIMENT_ID']
          url = ('https://api.github.com/repos/klb-t/chatadhd/actions/artifacts?' +
                 urllib.parse.urlencode({'name': name, 'per_page': 1}))
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2026-03-10',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read(65537)
          if len(raw) > 65536:
              raise SystemExit('Reservation lookup response too large; refusing the run.')
          result = json.loads(raw)
          if type(result.get('total_count')) is not int or not isinstance(result.get('artifacts'), list):
              raise SystemExit('Invalid reservation lookup response; refusing the run.')
          if result['total_count'] or result['artifacts']:
              raise SystemExit('An earlier reservation exists for this experiment_id; refusing duplicate spend.')
          pilot_dir = pathlib.Path(os.environ['PILOT_DIR'])
          manifest = pilot_dir / 'manifest.json'
          reservation = {
              'schema': 'loom.live_pilot_reservation/1',
              'experiment_id': os.environ['EXPERIMENT_ID'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit': os.environ['GITHUB_SHA'],
              'manifest_sha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'state': 'reserved_before_any_paid_call',
              'automatic_retry_permitted': False,
          }
          with (pilot_dir / 'reservation.json').open('x', encoding='utf-8') as f:
              json.dump(reservation, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('One-time reservation prepared; no paid call has started.')
          PY

      - name: Save reservation before paid calls
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-openrouter-reservation-${{ steps.gate.outputs.experiment_id }}
          path: ${{ env.PILOT_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Run bounded real-model requests
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.LOOM_OPENROUTER_PILOT_KEY }}
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=15s 20m \
            python3 loom/tools/structure/openrouter_runner.py run \
              "$PILOT_DIR/manifest.json" --run-dir "$PILOT_DIR/run"

      - name: Score retained responses, including partial runs
        if: always() && steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -f "$PILOT_DIR/manifest.json" ] && [ -d "$PILOT_DIR/run" ]; then
            timeout --signal=TERM --kill-after=10s 120s \
              python3 loom/tools/structure/live_pilot.py score \
                --run-dir "$PILOT_DIR/run" --manifest "$PILOT_DIR/manifest.json" \
                --output "$PILOT_DIR/score.json"
          fi

      - name: Preserve inputs, ledger and first responses on GitHub
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-openrouter-results-${{ steps.gate.outputs.experiment_id }}-${{ github.run_id }}
          path: ${{ env.PILOT_DIR }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize the attempt without credentials or prompt bodies
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          EXPERIMENT_ID: ${{ steps.gate.outputs.experiment_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['PILOT_DIR'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('Experiment: `' + os.environ['EXPERIMENT_ID'] + '`\n\n')
              f.write('Commit: `' + os.environ['GITHUB_SHA'] + '`\n\n')
              f.write('Score file present: ' + str((root / 'score.json').is_file()) + '\n\n')
              f.write('Read the results artifact and ledger before interpreting completion or cost. ')
              f.write('Do not rerun a failed or interrupted paid attempt.\n')
          PY
