name: Loom (C++ kernel)

on:
  push:
    # Feature branches are checked by pull_request, avoiding a second matrix.
    branches: [ main ]
    paths:
      - "loom/**"
      - "engine/**"
      - "core/**"
      - "docs/contracts/**"
      - "!loom/*.md"
      - "!loom/tools/structure/*.md"
      - ".github/workflows/loom.yml"
      - ".github/scripts/**"
      - ".github/ctest-evidence-policy*.json"
      - ".github/asan_shards.json"
      - ".github/ci_legs.json"
  pull_request:
    paths:
      - "loom/**"
      - "engine/**"
      - "core/**"
      - "docs/contracts/**"
      - "!loom/*.md"
      - "!loom/tools/structure/*.md"
      - ".github/workflows/loom.yml"
      - ".github/scripts/**"
      - ".github/ctest-evidence-policy*.json"
      - ".github/asan_shards.json"
      - ".github/ci_legs.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is data: legs in .github/ci_legs.json, the asan shard plan in .github/asan_shards.json.
  plan:
    name: plan matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand the legs (asan is split into the shards of the plan)
        id: matrix
        run: |
          python3 .github/scripts/asan_shards.py matrix --legs .github/ci_legs.json --shards .github/asan_shards.json > matrix.json
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build-test:
    needs: plan
    name: ${{ matrix.name || format('{0} ({1})', matrix.preset, matrix.cxx) }}
    runs-on: ubuntu-24.04
    # ASan+UBSan, measured: cold build ~25 min + FFI companion ~8 min (run 38528837225: job cancelled at 45 min with
    # only 11 min of Test) + CTest ~80 CPU-minutes (slowest: onboarding_store 350 s, kb_pack 280 s, cli.smoke 495 s).
    # The 45 min job limit is therefore far too small for this leg; the others fit.
    # dev (g++), measured 2026-10-23 (run 39959453902 on 5090ab2c): build 2 min + CTest 30 min + JNI + web workbench
    # (npm ci, build, unit, 60+ e2e scripts) hit the 45 min limit at 12 min of the web step; GitHub reports a job
    # timeout as "cancelled". The web stage grows with every M1 package, so dev gets 100 (a preset, not a target).
    # asan's ctest step alone took 140 min on 2026-10-23 (run 284, cut at the 150-min job limit; 514 min of tests over 4
    # slots), so the asan leg runs as shards (.github/asan_shards.json), each estimated at ~45-60 min of tests. dev 100 since run 281.
    # Per-leg limit (a preset) comes from the matrix data: timeout in .github/ci_legs.json.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 3G

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Lineage regressions compare preserved historical commits, not only HEAD.
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libsqlite3-dev libssl-dev clang
          # libc++ headers and runtime for the clang the leg above uses (ubuntu-24.04: clang 18); only the libcxx leg needs them.
          if [ '${{ matrix.preset }}' = libcxx ]; then sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev; fi

      # The Unicode tables are generated from CPython 3.11 (Unicode 14.0);
      # the compat tests compare against the same interpreter version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python engine dependencies
        run: python -m pip install requests cryptography -r loom/tools/contracts/requirements.txt -r loom/tools/resource_graph/requirements.txt

      - name: Check the CTest evidence guard
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      # restore + save are split so that the compiled objects are stored even when a later step fails or the
      # job is cancelled (a single actions/cache step saves only after a fully green job, so a leg that never
      # finished, like asan at 45 min, would never get a warm cache). Compression keeps the sanitizer objects small
      # enough for the repository cache quota.
      - name: ccache (restore)
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ matrix.cxx }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-${{ matrix.cxx }}-

      - name: Configure
        working-directory: loom
        # ctypes is exercised in both ordinary builds. The existing ASan preset
        # runs instrumented native executables and does not build the FFI library;
        # its ctypes cases use a separately recorded ordinary GCC companion.
        run: >-
          cmake --preset ${{ matrix.preset }} -DLOOM_BUILD_SERVER=ON
          -DLOOM_SHARED=${{ matrix.preset == 'asan' && 'OFF' || 'ON' }}
          -DCMAKE_C_FLAGS_DEBUG=${{ matrix.debug_info }}
          -DCMAKE_CXX_FLAGS_DEBUG=${{ matrix.debug_info }}
          -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        working-directory: loom
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Build the ordinary FFI companion for native sanitizer tests
        if: matrix.preset == 'asan'
        working-directory: loom
        # Native executables remain instrumented. ctypes must also execute the
        # mandatory Packet suite, without loading ASan into ordinary CPython.
        run: |
          cmake -S . -B build/asan-ffi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DLOOM_USE_SYSTEM_SQLITE=ON \
            -DLOOM_SHARED=ON -DLOOM_WERROR=ON \
            -DLOOM_BUILD_TESTS=OFF -DLOOM_BUILD_CLI=OFF -DLOOM_BUILD_SERVER=OFF
          cmake --build build/asan-ffi --target loom --parallel 2

      - name: ccache (save)
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ matrix.cxx }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-${{ github.sha }}

      - name: Test
        working-directory: loom
        shell: bash
        run: |
          mkdir -p build/${{ matrix.preset }}/verification
          if [ '${{ matrix.preset }}' = asan ]; then
            export LOOM_LIBRARY="$PWD/build/asan-ffi/libloom.so"
            python ../.github/scripts/write_build_receipt.py \
              --preset asan-ffi-companion \
              --cmake-cache build/asan-ffi/CMakeCache.txt \
              --cmake-field CMAKE_BUILD_TYPE \
              --cmake-field CMAKE_C_COMPILER \
              --cmake-field CMAKE_CXX_COMPILER \
              --cmake-field CMAKE_C_FLAGS \
              --cmake-field CMAKE_CXX_FLAGS \
              --cmake-field LOOM_USE_SYSTEM_SQLITE \
              --cmake-field LOOM_SHARED \
              --cmake-field LOOM_WERROR \
              --output build/asan/verification/ffi-companion-receipt.json \
              --binary "$LOOM_LIBRARY"
          fi
          python ../.github/scripts/write_build_receipt.py \
            --preset ${{ matrix.preset }} \
            --cmake-cache build/${{ matrix.preset }}/CMakeCache.txt \
            --cmake-field CMAKE_GENERATOR \
            --cmake-field CMAKE_BUILD_TYPE \
            --cmake-field CMAKE_C_COMPILER \
            --cmake-field CMAKE_CXX_COMPILER \
            --cmake-field CMAKE_C_FLAGS \
            --cmake-field CMAKE_C_FLAGS_DEBUG \
            --cmake-field CMAKE_CXX_FLAGS \
            --cmake-field CMAKE_CXX_FLAGS_DEBUG \
            --cmake-field LOOM_USE_SYSTEM_SQLITE \
            --cmake-field LOOM_SHARED \
            --cmake-field LOOM_WERROR \
            --cmake-field LOOM_BUILD_SERVER \
            --output build/${{ matrix.preset }}/verification/build-receipt.json \
            --binary build/${{ matrix.preset }}/loom_tests \
            --binary build/${{ matrix.preset }}/loom_compat_tool \
            --binary build/${{ matrix.preset }}/loom_candidate_graph_native_tool \
            --binary build/${{ matrix.preset }}/cli/loom \
            --binary build/${{ matrix.preset }}/server/loom-server \
            --optional-binary build/${{ matrix.preset }}/libloom.so
          # The manifest is always the WHOLE suite; a shard selects its part with the same code that verify_ctest uses.
          ctest --preset ${{ matrix.preset }} --show-only=json-v1 > build/${{ matrix.preset }}/verification/ctest-manifest.json
          SELECT=()
          if [ -n '${{ matrix.shard }}' ]; then
            REGEX=$(python ../.github/scripts/asan_shards.py select --shards ../.github/asan_shards.json \
              --shard '${{ matrix.shard }}' --manifest build/${{ matrix.preset }}/verification/ctest-manifest.json)
            SELECT=(-R "$REGEX")
          fi
          ctest --preset ${{ matrix.preset }} --no-tests=error "${SELECT[@]}" \
            --test-output-size-passed 10485760 --test-output-size-failed 10485760 \
            --output-junit "$PWD/build/${{ matrix.preset }}/verification/ctest.xml"

      - name: Require actual case execution and account for opt-in scenarios
        if: always()
        run: |
          python .github/scripts/verify_ctest.py \
            --policy .github/ctest-evidence-policy.json \
            --manifest loom/build/${{ matrix.preset }}/verification/ctest-manifest.json \
            --junit loom/build/${{ matrix.preset }}/verification/ctest.xml \
            --preset ${{ matrix.preset }} \
            ${{ matrix.shard && format('--shards-file .github/asan_shards.json --shard {0}', matrix.shard) || '' }} \
            --output loom/build/${{ matrix.preset }}/verification/executed-cases.json

      - name: Retain complete CTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}-${{ matrix.cxx }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: |
            loom/build/${{ matrix.preset }}/verification/
            loom/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Set up Java for the real JNI bridge smoke test
        if: matrix.preset == 'dev'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JNI against libloom
        if: matrix.preset == 'dev'
        run: |
          cmake -S loom/android/verify -B loom/android/verify/build -DLOOM_LIBRARY="$PWD/loom/build/dev/libloom.so"
          cmake --build loom/android/verify/build --parallel 2
          ctest --test-dir loom/android/verify/build --output-on-failure --no-tests=error

      - name: Set up Node for the workbench
        if: matrix.preset == 'dev'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: loom/web/package-lock.json

      - name: Build and test web workbench
        if: matrix.preset == 'dev'
        working-directory: loom/web
        run: |
          npm ci
          npm run build
          npm run test:transport
          npm run test:workspace-state
          npm run test:context-plan
          npm run test:application-profiles
          npm run test:imported-message-content-state
          npm run test:shell-history
          npm run test:shell-menu
          npm run test:composer-menu
          npm run test:navigator-state
          npm run test:node-card-state
          npm run test:navigator-receipt
          npm run test:navigator-map
          npm run test:settings-human
          npm run test:role-card
          npm run test:context-receipt
          npm run test:context-strip
          npm run test:interview
          npm run test:me-view
          npm run test:label-guard
          npm run test:import-truth-state
          npm run test:attachment-chips
          npm run test:graph-help
          npm run test:chat-graph-focus
          npm run test:testids-doc
          npx playwright install --with-deps chromium
          npm run e2e
          npm run test:m1-navigator
          npm run test:m1-settings
          npm run test:m1-context-sent
          npm run test:m1-context-menu
          npm run test:m1-history
          npm run test:m1-profile
          npm run test:m1-me
          npm run test:m1-import-truth
          npm run test:chat-first
          npm run test:composer-menu-browser
          npm run test:workspace
          npm run test:chat-context
          npm run test:application-profiles-browser
          npm run test:imported-message-content-browser
          npm run test:imported-message-content-native
          npm run test:application-profile-graph
          npm run test:product-integration
          python ../../.github/scripts/run_optional_npm_scripts.py \
            --package-json package.json \
            --script test:interface-2 \
            --script test:interface-2-native

  # Every sharded leg proves its own part; this job proves the parts add up to the whole manifest,
  # each entry executed in exactly one shard.
  shards-cover-manifest:
    needs: [plan, build-test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: ctest-asan-*
          path: shard-evidence
      - name: Union of the asan shards equals the manifest
        run: |
          set -e
          M=$(find shard-evidence -name ctest-manifest.json | head -1)
          python .github/scripts/asan_shards.py merge --shards .github/asan_shards.json --manifest "$M" \
            $(find shard-evidence -name executed-cases.json)
