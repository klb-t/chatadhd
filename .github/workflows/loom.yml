name: Loom (C++ kernel)

on:
  push:
    # Feature branches are checked by pull_request, avoiding a second matrix.
    branches: [ main ]
    paths:
      - "loom/**"
      - "engine/**"
      - "core/**"
      - "docs/contracts/**"
      - "!loom/*.md"
      - "!loom/tools/structure/*.md"
      - ".github/workflows/loom.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "loom/**"
      - "engine/**"
      - "core/**"
      - "docs/contracts/**"
      - "!loom/*.md"
      - "!loom/tools/structure/*.md"
      - ".github/workflows/loom.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.preset }} (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: dev, cc: gcc, cxx: g++ }
          - { preset: asan, cc: gcc, cxx: g++ }
          # Closest to the Android build: Clang + the vendored SQLite amalgamation.
          - { preset: vendored, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Lineage regressions compare preserved historical commits, not only HEAD.
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache libsqlite3-dev libssl-dev clang

      # The Unicode tables are generated from CPython 3.11 (Unicode 14.0);
      # the compat tests compare against the same interpreter version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python engine dependencies
        run: python -m pip install requests cryptography -r loom/tools/contracts/requirements.txt

      - name: Check the CTest evidence guard
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ matrix.cxx }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-${{ matrix.cxx }}-

      - name: Configure
        working-directory: loom
        # ctypes is exercised in both ordinary builds. The existing ASan preset
        # runs instrumented native executables and does not build the FFI library;
        # its pre-existing unavailable FFI cases are identified in the receipt.
        run: >-
          cmake --preset ${{ matrix.preset }} -DLOOM_BUILD_SERVER=ON
          -DLOOM_SHARED=${{ matrix.preset == 'asan' && 'OFF' || 'ON' }}
          -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        working-directory: loom
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Test
        working-directory: loom
        shell: bash
        run: |
          mkdir -p build/${{ matrix.preset }}/verification
          ctest --preset ${{ matrix.preset }} --show-only=json-v1 > build/${{ matrix.preset }}/verification/ctest-manifest.json
          ctest --preset ${{ matrix.preset }} --no-tests=error \
            --test-output-size-passed 10485760 --test-output-size-failed 10485760 \
            --output-junit build/${{ matrix.preset }}/verification/ctest.xml

      - name: Require actual case execution and account for opt-in scenarios
        if: always()
        run: |
          python .github/scripts/verify_ctest.py \
            --manifest loom/build/${{ matrix.preset }}/verification/ctest-manifest.json \
            --junit loom/build/${{ matrix.preset }}/verification/ctest.xml \
            --preset ${{ matrix.preset }} \
            --output loom/build/${{ matrix.preset }}/verification/executed-cases.json

      - name: Retain complete CTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.preset }}-${{ matrix.cxx }}
          path: |
            loom/build/${{ matrix.preset }}/verification/
            loom/build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Set up Java for the real JNI bridge smoke test
        if: matrix.preset == 'dev'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JNI against libloom
        if: matrix.preset == 'dev'
        run: |
          cmake -S loom/android/verify -B loom/android/verify/build -DLOOM_LIBRARY="$PWD/loom/build/dev/libloom.so"
          cmake --build loom/android/verify/build --parallel 2
          ctest --test-dir loom/android/verify/build --output-on-failure --no-tests=error

      - name: Set up Node for the workbench
        if: matrix.preset == 'dev'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: loom/web/package-lock.json

      - name: Build and test web workbench
        if: matrix.preset == 'dev'
        working-directory: loom/web
        run: |
          npm ci
          npm run build
          npm run test:transport
          npm run test:workspace-state
          npm run test:context-plan
          npm run test:application-profiles
          npm run test:imported-message-content-state
          npx playwright install --with-deps chromium
          npm run e2e
          npm run test:workspace
          npm run test:chat-context
          npm run test:application-profiles-browser
          npm run test:imported-message-content-browser
          npm run test:imported-message-content-native
          npm run test:application-profile-graph
