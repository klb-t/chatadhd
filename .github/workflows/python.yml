name: Python sanity

on:
  push:
    branches: [ main ]
    paths:
      - "main.py"
      - "core/**/*.py"
      - "engine/**/*.py"
      - "gui/**/*.py"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "main.py"
      - "core/**/*.py"
      - "engine/**/*.py"
      - "gui/**/*.py"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile source tree
        run: python -m compileall -q main.py core engine gui
